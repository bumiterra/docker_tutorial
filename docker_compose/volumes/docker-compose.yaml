services:
  mongodb1:
    container_name: mongodb1
    image: mongo:latest
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: bas
      MONGO_INITDB_ROOT_PASSWORD: bas
      MONGO_INITDB_DATABASE: mydb
    volumes:
      - mongo-data1:/data/db
  mongodb2:
    container_name: mongodb2
    image: mongo:latest
    ports:
      - 27018:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: bas
      MONGO_INITDB_ROOT_PASSWORD: bas
      MONGO_INITDB_DATABASE: mydb
    volumes:
      - type: volume
        source: mongo-data2
        target: /data/db
        read_only: false

volumes:
  mongo-data1:
    name: mongo-data1
  mongo-data2:
    name: mongo-data2
