services:
  mongodb-example:
    container_name: mongodb-example
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: bas
      MONGO_INITDB_ROOT_PASSWORD: bas
      MONGO_INITDB_DATABASE: mydb
    ports:
      - 27017:27017
    networks:
      - network_example
  mongodb-express-example:
    depends_on:
      - mongodb-example
    container_name: mongodb-express-example
    restart: always
    image: mongo-express:latest
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb-example
      ME_CONFIG_MONGODB_ADMINUSERNAME: bas
      ME_CONFIG_MONGODB_ADMINPASSWORD: bas
    ports:
      - 8081:8081
    networks:
      - network_example
networks:
  network_example:
    name: network_example
    driver: bridge
